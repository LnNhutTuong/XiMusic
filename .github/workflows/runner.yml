name: Test Self Hosted Runner

on:
  push:
    branches:
      - learn-CI/CD

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test runner
        run: |
          echo "===== RUNNER INFO ====="
          whoami
          hostname
          pwd
          node -v
          npm -v
          docker --version
          docker compose version