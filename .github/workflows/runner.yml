name: Deploy

on:
  push:
    branches:
      - Learn_CI/CD

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy to fake VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/github_actions_cd
          chmod 600 ~/.ssh/github_actions_cd

          ssh -i ~/.ssh/github_actions_cd \
            -p 2222 \
            -o StrictHostKeyChecking=no \
            deploy@localhost \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && docker pull ghcr.io/lnnhuttuong/xms-backend:latest"